name: CI

# Por enquanto só dispara na mão (aba Actions → Run workflow, ou `gh workflow run CI`).
#
# O gatilho automático está desligado de propósito. O GitHub não aloca máquina
# para repositório privado de organização sem forma de pagamento cadastrada:
# ele aceita o push, enfileira o job e nunca dá início. O job morre no
# timeout-minutes com zero passos executados e manda e-mail de falha a cada
# envio — ruído sobre um problema que não é do código.
#
# Para religar: cadastrar cartão em Settings → Billing da organização (o plano
# gratuito já inclui 2.000 min/mês e isto gasta ~4 min por execução) e trocar
# este bloco por:
#
#   on:
#     push:
#       branches: ['**']
#     pull_request:
#       branches: [main]
#
# Até lá, a verificação é feita na mão antes de cada envio: os mesmos três
# passos abaixo, na mesma ordem.
on:
  workflow_dispatch:

concurrency:
  # Push novo na mesma branch cancela a execução anterior: o resultado velho
  # não interessa mais e a fila do Actions não precisa carregar isso.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: typecheck · testes · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # O build importa `@/lib/db`, que monta o cliente no carregamento do
      # módulo e exige DATABASE_URL. O postgres.js só abre conexão na primeira
      # consulta, e nenhuma página é estática o bastante para consultar durante
      # o build — então uma URL de mentira basta e o CI não precisa de banco.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build de produção
        run: npm run build
