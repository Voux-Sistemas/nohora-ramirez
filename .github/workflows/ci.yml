name: CI

# Roda no push de qualquer branch e em todo pull request para a main.
# O objetivo é simples: nada entra na main sem typecheck, teste e build de
# produção passando — porque o deploy da Railway sai daqui.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  # Push novo na mesma branch cancela a execução anterior: o resultado velho
  # não interessa mais e a fila do Actions não precisa carregar isso.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: typecheck · testes · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # O build importa `@/lib/db`, que monta o cliente no carregamento do
      # módulo e exige DATABASE_URL. O postgres.js só abre conexão na primeira
      # consulta, e nenhuma página é estática o bastante para consultar durante
      # o build — então uma URL de mentira basta e o CI não precisa de banco.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build de produção
        run: npm run build
