name: CI

# Corre a cada envio, em qualquer branch.
#
# Esteve desligado de 6 de agosto de 2026 até 19, e o motivo tinha nome: o
# repositório era privado, e o GitHub não aloca máquina a repositório privado de
# organização sem forma de pagamento cadastrada. Aceitava o push, enfileirava o
# job e nunca lhe dava início — o job morria no `timeout-minutes` com zero passos
# executados e mandava e-mail de falha a cada envio, sobre um problema que não
# era do código. A execução 31120414697 é essa: 15 minutos, nada feito.
#
# O repositório passou a público, e repositório público corre nos runners
# padrão de graça, sem cartão e sem tecto de minutos. Provado a 19 de agosto:
# execução 32299586750, um minuto e seis segundos, tudo verde.
#
# O `workflow_dispatch` fica ao lado do gatilho automático — serve para
# reexecutar à mão sem ter de inventar um commit.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Push novo na mesma branch cancela a execução anterior: o resultado velho
  # não interessa mais e a fila do Actions não precisa carregar isso.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: typecheck · testes · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # O build importa `@/lib/db`, que monta o cliente no carregamento do
      # módulo e exige DATABASE_URL. O postgres.js só abre conexão na primeira
      # consulta, e nenhuma página é estática o bastante para consultar durante
      # o build — então uma URL de mentira basta e o CI não precisa de banco.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build de produção
        run: npm run build
